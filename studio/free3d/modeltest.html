<!doctype html><meta charset=utf-8><body style="margin:0;background:#000">

<script>
const W=1500,H=900;const R=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});R.setSize(W,H);document.body.appendChild(R.domElement);R.outputColorSpace=THREE.SRGBColorSpace;
const S=new THREE.Scene();S.background=new THREE.Color(0x1d3a30);S.fog=new THREE.FogExp2(0x0a1a14,.05);
S.add(new THREE.HemisphereLight(0xb4d8c8,0x3a4038,1.1));const d=new THREE.DirectionalLight(0xe8f4e0,1.4);d.position.set(2,6,8);S.add(d);const rl=new THREE.DirectionalLight(0x8fe8c8,1.2);rl.position.set(-3,5,-8);S.add(rl);
const fl=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.MeshBasicMaterial({color:0x2a4038}));fl.rotation.x=-Math.PI/2;S.add(fl);
const GM=new THREE.DataTexture(new Uint8Array([90,170,255]),3,1,THREE.RedFormat);GM.minFilter=GM.magFilter=THREE.NearestFilter;GM.needsUpdate=true;
const OUT=(th)=>{const m=new THREE.MeshBasicMaterial({color:0x0c0806,side:THREE.BackSide});m.onBeforeCompile=sh=>{sh.uniforms.uTh={value:th};sh.vertexShader='uniform float uTh;\n'+sh.vertexShader.replace('#include <skinning_vertex>','#include <skinning_vertex>\n vec3 oN=normalize(normal);\n#ifdef USE_SKINNING\n mat4 skM=skinWeight.x*boneMatX+skinWeight.y*boneMatY+skinWeight.z*boneMatZ+skinWeight.w*boneMatW;skM=bindMatrixInverse*skM*bindMatrix;oN=normalize((skM*vec4(oN,0.)).xyz);\n#endif\n transformed += oN*uTh;')};return m};
function toonify(root,th,tint){const outs=[];root.traverse(o=>{if(o.isMesh){const old=o.material;const m=new THREE.MeshToonMaterial({gradientMap:GM,map:old.map||null,color:tint||old.color||0xffffff});if(m.map)m.map.colorSpace=THREE.SRGBColorSpace;o.material=m;o.castShadow=false;const ol=o.isSkinnedMesh?new THREE.SkinnedMesh(o.geometry,OUT(th)):new THREE.Mesh(o.geometry,OUT(th));if(o.isSkinnedMesh)ol.bind(o.skeleton,o.bindMatrix);ol.position.copy(o.position);ol.quaternion.copy(o.quaternion);ol.scale.copy(o.scale);outs.push([o.parent,ol])}});outs.forEach(([p,ol])=>p.add(ol));return root}
(async()=>{const ld=new GLTFLoader();const names=['Soldier','Michelle','Xbot','RobotExpressive'];const xs=[-3,-1,1,3];const mix=[];
 for(let i=0;i<names.length;i++){const g=await ld.loadAsync('models/'+names[i]+'.glb');const sc=SkeletonUtils.clone(g.scene);sc.updateMatrixWorld(true);let mn=1e9,mx_=-1e9;sc.traverse(o=>{if(o.isBone){const v=new THREE.Vector3();o.getWorldPosition(v);mn=Math.min(mn,v.y);mx_=Math.max(mx_,v.y)}});const h=(mx_-mn)*1.12||1;const k=1.75/h;const wrap=new THREE.Group();wrap.add(sc);sc.scale.multiplyScalar(k);sc.updateMatrixWorld(true);sc.updateMatrixWorld(true);let m2=1e9;sc.traverse(o=>{if(o.isBone){const v=new THREE.Vector3();o.getWorldPosition(v);m2=Math.min(m2,v.y)}});sc.position.y-=m2-.05;wrap.position.set(xs[i],0,0);wrap.rotation.y=-.25+i*.15;S.add(wrap);toonify(sc,.012/sc.scale.x,null);
  console.log(names[i],'h',h.toFixed(2),'anims',g.animations.map(a=>a.name+':'+a.duration.toFixed(1)).join(','));const mx=new THREE.AnimationMixer(sc);const a=g.animations.find(a=>/idle/i.test(a.name))||g.animations[0];if(a){const ac=mx.clipAction(a);ac.play();mx.setTime(.5)}mix.push(mx)}
 const cam=new THREE.PerspectiveCamera(30,W/H,.1,100);cam.position.set(0,1.3,9);cam.lookAt(0,.95,0);R.render(S,cam);window.DONE=1})();
